<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro - Sabor & Clic</title>

    {% include '_head_security.html' %}
  </head>
  <body>
    {% include '_flash.html' %}

    <header>
      <h1 class="logo">Sabor & Clic</h1>

      {% include '_logout.html' %}
    </header>
    <main class="container">
      <h2>Cadastro</h2>
      <form id="auth-form" data-api="/api/cadastro" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" type="text" required minlength="3" maxlength="100" />
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required maxlength="120" autocomplete="email" />
        <label for="senha">Senha</label>
        <input
          id="senha"
          name="senha"
          type="password"
          required
          maxlength="128"
          minlength="12"
          autocomplete="new-password"
        />
        <label for="endereco">Endereço de entrega</label>
        <input id="endereco" name="endereco" type="text" required minlength="5" maxlength="200" />
        <button type="submit">CRIAR CONTA</button>
      </form>
      <p id="mensagem-auth" role="status"></p>
      <p>
        <a href="/login">Login</a>
        ·
        <a href="/cadastro">Cadastro de cliente</a>
      </p>
    </main>

    {% include '_nav.html' %}

    <script src="/static/auth.js" defer></script>
  </body>
</html>
