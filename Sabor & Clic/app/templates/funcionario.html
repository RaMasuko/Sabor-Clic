<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Nova conta da equipe - Sabor & Clic</title>

    {% include '_head_security.html' %}
  </head>
  <body>
    {% include '_flash.html' %}

    <header>
      <h1 class="logo">Sabor & Clic</h1>

      {% include '_logout.html' %}
    </header>
    <main class="container">
      <h2>Nova conta da equipe</h2>
      <form id="auth-form" data-api="/api/funcionarios" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" type="text" required minlength="3" maxlength="100" />
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required maxlength="120" autocomplete="email" />
        <label for="senha">Senha</label>
        <input
          id="senha"
          name="senha"
          type="password"
          required
          maxlength="128"
          minlength="12"
          autocomplete="new-password"
        />
        <label for="cpf">CPF</label>
        <input id="cpf" name="cpf" type="text" required minlength="11" maxlength="14" />
        <label for="perfil">Perfil</label>
        <select id="perfil" name="perfil">
          <option value="cozinheiro">Cozinheiro</option>
          <option value="administrador">Administrador</option>
        </select>
        <label for="turno">Turno</label>
        <input id="turno" name="turno" type="text" maxlength="100" />
        <label for="especialidade">Especialidade</label>
        <input id="especialidade" name="especialidade" type="text" maxlength="100" />
        <button type="submit">CRIAR CONTA</button>
      </form>
      <p id="mensagem-auth" role="status"></p>
      <p>
        <a href="/login">Login</a>
        ·
        <a href="/cadastro">Cadastro de cliente</a>
      </p>
    </main>

    {% include '_nav.html' %}

    <script src="/static/auth.js" defer></script>
  </body>
</html>
