<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastrar Novo Prato - Sabor & Clic</title>

    {% include '_head_security.html' %}
  </head>
  <body>
    {% include '_flash.html' %}

    <header>
      <h1 class="logo">Sabor & Clic</h1>

      {% include '_logout.html' %}
    </header>
    <main class="container">
      <h2>Cadastrar Novo Prato</h2>
      <form id="form-novo-prato">
        <input id="prato-id" type="hidden" />
        <input id="versao" type="hidden" />
        <label for="nome">Nome do prato</label>
        <input id="nome" name="nome" type="text" required maxlength="100" />
        <label for="preco">Preço (R$)</label>
        <input
          id="preco"
          name="preco"
          type="number"
          required
          min="0.01"
          max="1000000"
          step="0.01"
        />
        <label for="descricao">Descrição</label>
        <textarea id="descricao" maxlength="250"></textarea>
        <label for="estoque">Estoque (porções)</label>
        <input
          max="1000000"
          id="estoque"
          name="estoque"
          type="number"
          required
          min="0"
          step="1"
          value="0"
        />
        <label for="status">Status</label>
        <select id="status">
          <option value="disponivel">Disponível</option>
          <option value="indisponivel">Indisponível</option>
        </select>
        <label for="ficha_tecnica">Ficha técnica / ingredientes</label>
        <textarea id="ficha_tecnica" maxlength="2000"></textarea>
        <button type="submit">Salvar Prato</button>
        <button type="button" id="cancelar-edicao" class="secondary">Limpar / novo prato</button>
      </form>
      <p id="mensagem" role="status"></p>
      <h3>Gerenciar catálogo</h3>
      <div id="catalogo-admin"></div>
    </main>

    {% include '_nav.html' %}

    <script src="/static/novo_prato.js" defer></script>
  </body>
</html>
