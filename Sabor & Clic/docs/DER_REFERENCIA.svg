<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780"><rect width="1100" height="780" fill="white"/><text x="35" y="38" font-size="26" font-family="Arial" fill="#333" font-weight="700">Sabor &amp; Clic - DER de referência</text><text x="35" y="67" font-size="15" font-family="Arial" fill="#333" font-weight="400">Arquivo nativo DER_SABOR_CLIC.brM3 fornecido. Revisão conceitual pelo grupo no brModelo.</text><rect x="35" y="120" width="230" height="86" fill="white" stroke="#d32f2f"/><text x="47" y="146" font-size="17" font-family="Arial" fill="#333" font-weight="700">CLIENTES</text><text x="47" y="173" font-size="13" font-family="Arial" fill="#333" font-weight="400">PK id_cliente</text><text x="47" y="195" font-size="13" font-family="Arial" fill="#333" font-weight="400">nome, email, endereço</text><rect x="420" y="120" width="240" height="108" fill="white" stroke="#d32f2f"/><text x="432" y="146" font-size="17" font-family="Arial" fill="#333" font-weight="700">PEDIDOS</text><text x="432" y="173" font-size="13" font-family="Arial" fill="#333" font-weight="400">PK id_pedido</text><text x="432" y="195" font-size="13" font-family="Arial" fill="#333" font-weight="400">FK id_cliente</text><text x="432" y="217" font-size="13" font-family="Arial" fill="#333" font-weight="400">status, total, endereço</text><rect x="805" y="120" width="255" height="108" fill="white" stroke="#d32f2f"/><text x="817" y="146" font-size="17" font-family="Arial" fill="#333" font-weight="700">ITENS_PEDIDO</text><text x="817" y="173" font-size="13" font-family="Arial" fill="#333" font-weight="400">PK id_item</text><text x="817" y="195" font-size="13" font-family="Arial" fill="#333" font-weight="400">FK id_pedido, FK id_prato</text><text x="817" y="217" font-size="13" font-family="Arial" fill="#333" font-weight="400">quantidade, preço, nome</text><rect x="805" y="365" width="255" height="86" fill="white" stroke="#d32f2f"/><text x="817" y="391" font-size="17" font-family="Arial" fill="#333" font-weight="700">PRATOS</text><text x="817" y="418" font-size="13" font-family="Arial" fill="#333" font-weight="400">PK id_prato</text><text x="817" y="440" font-size="13" font-family="Arial" fill="#333" font-weight="400">estoque, versão, excluído</text><rect x="35" y="365" width="230" height="108" fill="white" stroke="#d32f2f"/><text x="47" y="391" font-size="17" font-family="Arial" fill="#333" font-weight="700">RESERVAS</text><text x="47" y="418" font-size="13" font-family="Arial" fill="#333" font-weight="400">PK id_reserva</text><text x="47" y="440" font-size="13" font-family="Arial" fill="#333" font-weight="400">FK id_cliente, FK id_bancada</text><text x="47" y="462" font-size="13" font-family="Arial" fill="#333" font-weight="400">início, fim, status</text><rect x="420" y="365" width="240" height="86" fill="white" stroke="#d32f2f"/><text x="432" y="391" font-size="17" font-family="Arial" fill="#333" font-weight="700">BANCADAS</text><text x="432" y="418" font-size="13" font-family="Arial" fill="#333" font-weight="400">PK id_bancada</text><text x="432" y="440" font-size="13" font-family="Arial" fill="#333" font-weight="400">nome, localização, ativo</text><path d="M265 165 L420 165" stroke="#666"/><text x="305" y="152" font-size="12" font-family="Arial" fill="#333" font-weight="400">1 a 0..N</text><path d="M660 165 L805 165" stroke="#666"/><text x="694" y="152" font-size="12" font-family="Arial" fill="#333" font-weight="400">1 a 1..N*</text><path d="M930 228 L930 365" stroke="#666"/><text x="946" y="308" font-size="12" font-family="Arial" fill="#333" font-weight="400">0..N a 1</text><path d="M145 206 L145 365" stroke="#666"/><text x="158" y="300" font-size="12" font-family="Arial" fill="#333" font-weight="400">1 a 0..N</text><path d="M265 415 L420 415" stroke="#666"/><text x="305" y="403" font-size="12" font-family="Arial" fill="#333" font-weight="400">0..N a 1</text><text x="35" y="555" font-size="18" font-family="Arial" fill="#333" font-weight="700">Entidades auxiliares e relações lógicas</text><text x="35" y="584" font-size="13" font-family="Arial" fill="#333" font-weight="400">FUNCIONARIOS: equipe e perfil. AUTH_SESSIONS: tipo e usuario_id apontam logicamente para a conta.</text><text x="35" y="608" font-size="13" font-family="Arial" fill="#333" font-weight="400">LOGIN_ATTEMPTS: limita tentativas. LOG_PEDIDOS: histórico ligado logicamente ao pedido, sem FK física.</text><text x="35" y="648" font-size="13" font-family="Arial" fill="#333" font-weight="400">* Um pedido concluído pelo modelo contém pelo menos um item. A FK isolada permite pedido sem itens.</text><text x="35" y="672" font-size="13" font-family="Arial" fill="#333" font-weight="400">Notação: 1 = exatamente um. 0..N = zero ou muitos. PK = chave primária. FK = chave estrangeira.</text><text x="35" y="706" font-size="13" font-family="Arial" fill="#333" font-weight="400">Fonte: sql/01_modelo_fisico.sql. Regras temporais e estoque também dependem de sql/20_triggers.sql.</text><text x="35" y="733" font-size="13" font-family="Arial" fill="#333" font-weight="400">Diagrama de referência: comparar com o arquivo nativo fornecido e revisar a modelagem conceitual.</text></svg>